# Builds the backend Docker image, publishes it to GitHub Container Registry (free), and rolls it out
# to Azure Container Apps. The image job always runs on backend changes; the Azure job runs once set up.
#
# One-time setup (see README -> Deployment):
#   1. Push once so this workflow publishes ghcr.io/<owner>/trip-aura-api, then make that package Public
#      (GitHub profile -> Packages -> trip-aura-api -> Package settings -> Change visibility).
#   2. Run deploy/azure/setup.sh in Azure Cloud Shell. It prints the JSON for the AZURE_CREDENTIALS secret.
#   3. GitHub repo -> Settings -> Secrets and variables -> Actions:
#        secret   AZURE_CREDENTIALS = JSON printed by setup.sh
#        variable AZURE_ENABLED     = true
name: Deploy backend (Azure)

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend-azure.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-backend-azure
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/trip-aura-api
  RESOURCE_GROUP: trip-aura
  CONTAINER_APP: trip-aura-api

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: ${{ vars.AZURE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Roll out the new image
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}" --only-show-errors --output none
          URL=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          echo "Deployed: https://$URL" | tee -a "$GITHUB_STEP_SUMMARY"
